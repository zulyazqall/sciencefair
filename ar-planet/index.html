<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>AR Earth & Moon</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      /* =========================
       START SCREEN
    ========================= */

      #startScreen {
        position: fixed;
        z-index: 99999;

        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: radial-gradient(
          circle at center,
          #16234d 0%,
          #070b1c 45%,
          #000 100%
        );

        color: white;

        text-align: center;

        padding: 25px;
      }

      .startBox {
        width: min(90%, 420px);

        padding: 30px;

        border-radius: 24px;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.15);

        backdrop-filter: blur(15px);

        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
      }

      .planet {
        font-size: 60px;

        margin-bottom: 10px;
      }

      h1 {
        margin: 0 0 10px;

        font-size: 28px;
      }

      .description {
        color: #bfc7dd;

        line-height: 1.5;

        font-size: 14px;
      }

      #startButton {
        width: 100%;

        margin-top: 20px;

        padding: 15px;

        border: 0;

        border-radius: 12px;

        background: #ffffff;

        color: #080b17;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;
      }

      #startButton:active {
        transform: scale(0.98);
      }

      /* =========================
       TOP UI
    ========================= */

      #ui {
        position: fixed;

        z-index: 1000;

        top: 15px;

        left: 15px;

        right: 15px;

        pointer-events: none;

        text-align: center;
      }

      .info {
        display: inline-block;

        padding: 12px 18px;

        border-radius: 15px;

        background: rgba(0, 0, 0, 0.65);

        color: white;

        backdrop-filter: blur(8px);
      }

      .info h2 {
        margin: 0 0 5px;

        font-size: 18px;
      }

      .info p {
        margin: 0;

        font-size: 13px;

        color: #c7cce0;
      }

      /* =========================
       STATUS
    ========================= */

      #status {
        position: fixed;

        z-index: 1001;

        bottom: 20px;

        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.75);

        color: white;

        font-size: 13px;

        pointer-events: none;

        white-space: nowrap;
      }

      /* =========================
       ERROR
    ========================= */

      #error {
        display: none;

        position: fixed;

        z-index: 10000;

        left: 15px;

        right: 15px;

        bottom: 70px;

        padding: 15px;

        border-radius: 15px;

        background: rgba(150, 0, 0, 0.9);

        color: white;

        font-size: 13px;

        text-align: center;
      }
    </style>
  </head>

  <body>
    <!-- =====================================
     START SCREEN
===================================== -->

    <div id="startScreen">
      <div class="startBox">
        <div class="planet">🌎 🌕</div>

        <h1>AR Solar System</h1>

        <p class="description">
          Explore Earth and Moon in augmented reality. Allow camera access and
          point your camera at a barcode marker.
        </p>

        <button id="startButton">Start AR</button>
      </div>
    </div>

    <!-- =====================================
     UI
===================================== -->

    <div id="ui">
      <div class="info">
        <h2>🌎 Earth & 🌕 Moon</h2>

        <p>Barcode 5 = Earth &nbsp; | &nbsp; Barcode 7 = Moon</p>
      </div>
    </div>

    <!-- =====================================
     STATUS
===================================== -->

    <div id="status">Waiting for camera...</div>

    <div id="error"></div>

    <!-- =====================================
     AR SCENE
===================================== -->

    <a-scene
      id="scene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="
    antialias: true;
    alpha: true;
    precision: mediump;
  "
      arjs="
    sourceType: webcam;
    trackingMethod: best;
    detectionMode: mono_and_matrix;
    matrixCodeType: 3x3;
    debugUIEnabled: false;
  "
      device-orientation-permission-ui="enabled: false"
    >
      <!-- =====================================
       ASSETS
  ===================================== -->

      <a-assets>
        <!-- IMPORTANT:
         These files must physically exist
         beside index.html
    -->

        <a-asset-item id="earthModel" src="./earth.glb"> </a-asset-item>

        <a-asset-item id="moonModel" src="./moon.glb"> </a-asset-item>
      </a-assets>

      <!-- =====================================
       LIGHT
  ===================================== -->

      <a-entity
        light="
      type: ambient;
      color: #ffffff;
      intensity: 1.5;
    "
      >
      </a-entity>

      <a-entity
        light="
      type: directional;
      color: #ffffff;
      intensity: 2;
    "
        position="2 4 3"
      >
      </a-entity>

      <!-- =====================================
       EARTH
       BARCODE 5
  ===================================== -->

      <a-marker
        id="earthMarker"
        type="barcode"
        value="5"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="earth"
          gltf-model="#earthModel"
          position="0 0.5 0"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
        >
        </a-entity>

        <a-text
          value="EARTH"
          position="0 1.4 0"
          rotation="-90 0 0"
          align="center"
          color="white"
          width="3"
        >
        </a-text>
      </a-marker>

      <!-- =====================================
       MOON
       BARCODE 7
  ===================================== -->

      <a-marker
        id="moonMarker"
        type="barcode"
        value="7"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="moon"
          gltf-model="#moonModel"
          position="0 0.5 0"
          scale="0.6 0.6 0.6"
          rotation="0 0 0"
        >
        </a-entity>

        <a-text
          value="MOON"
          position="0 1.4 0"
          rotation="-90 0 0"
          align="center"
          color="white"
          width="3"
        >
        </a-text>
      </a-marker>

      <!-- CAMERA -->

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById("startScreen");

      const startButton = document.getElementById("startButton");

      const status = document.getElementById("status");

      const errorBox = document.getElementById("error");

      const earth = document.getElementById("earth");

      const moon = document.getElementById("moon");

      const earthMarker = document.getElementById("earthMarker");

      const moonMarker = document.getElementById("moonMarker");

      /*
       * ======================================
       * ERROR DISPLAY
       * ======================================
       */

      function showError(message) {
        errorBox.style.display = "block";

        errorBox.innerHTML = message;
      }

      /*
       * ======================================
       * START AR
       * ======================================
       */

      startButton.addEventListener("click", async () => {
        status.textContent = "Requesting camera...";

        try {
          /*
           * Request camera permission.
           *
           * AR.js will use this camera stream.
           */

          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment",
              },
            },

            audio: false,
          });

          /*
           * Stop this temporary stream.
           *
           * AR.js will request/use the camera
           * for the AR scene.
           */

          stream.getTracks().forEach((track) => {
            track.stop();
          });

          startScreen.style.display = "none";

          status.textContent = "Camera ready — scan Barcode 5 or 7";
        } catch (error) {
          console.error(error);

          showError(
            "Camera permission was denied or unavailable.<br><br>" +
              "Please allow camera access and reload the page.",
          );

          status.textContent = "Camera unavailable";
        }
      });

      /*
       * ======================================
       * EARTH MODEL
       * ======================================
       */

      earth.addEventListener("model-loaded", () => {
        console.log("Earth GLB loaded");
      });

      earth.addEventListener("model-error", (event) => {
        console.error("Earth model error:", event);

        showError(
          "Could not load earth.glb.<br>" +
            "Check that the file exists beside index.html.",
        );
      });

      /*
       * ======================================
       * MOON MODEL
       * ======================================
       */

      moon.addEventListener("model-loaded", () => {
        console.log("Moon GLB loaded");
      });

      moon.addEventListener("model-error", (event) => {
        console.error("Moon model error:", event);

        showError(
          "Could not load moon.glb.<br>" +
            "Check that the file exists beside index.html.",
        );
      });

      /*
       * ======================================
       * EARTH MARKER
       * ======================================
       */

      earthMarker.addEventListener("markerFound", () => {
        status.textContent = "🌎 Earth detected!";
      });

      earthMarker.addEventListener("markerLost", () => {
        status.textContent = "Looking for Barcode 5 or 7...";
      });

      /*
       * ======================================
       * MOON MARKER
       * ======================================
       */

      moonMarker.addEventListener("markerFound", () => {
        status.textContent = "🌕 Moon detected!";
      });

      moonMarker.addEventListener("markerLost", () => {
        status.textContent = "Looking for Barcode 5 or 7...";
      });

      /*
       * ======================================
       * AR READY
       * ======================================
       */

      const scene = document.getElementById("scene");

      scene.addEventListener("loaded", () => {
        console.log("A-Frame scene loaded");
      });
    </script>
  </body>
</html>
