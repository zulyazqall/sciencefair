<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no"
    />

    <title>AR Earth & Moon</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      html,
      body {
        margin: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: black;

        font-family: Arial, sans-serif;
      }

      /* START */

      #start {
        position: fixed;

        inset: 0;

        z-index: 9999;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #050816;

        color: white;

        text-align: center;
      }

      .startBox {
        width: 85%;

        max-width: 420px;

        padding: 30px;

        border-radius: 22px;

        background: rgba(255, 255, 255, 0.08);
      }

      .startBox h1 {
        font-size: 30px;

        margin-bottom: 10px;
      }

      .startBox p {
        color: #b8bfd2;

        line-height: 1.6;

        font-size: 14px;
      }

      button {
        border: 0;

        border-radius: 12px;

        padding: 15px 30px;

        margin-top: 15px;

        font-size: 17px;

        font-weight: bold;
      }

      /* STATUS */

      #status {
        position: fixed;

        z-index: 1000;

        bottom: 20px;

        left: 50%;

        transform: translateX(-50%);

        padding: 12px 20px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.75);

        color: white;

        font-size: 13px;

        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <!-- ===================================
     START SCREEN
=================================== -->

    <div id="start">
      <div class="startBox">
        <h1>🌎 AR Solar System</h1>

        <p>Point your camera at Barcode 5 for Earth or Barcode 7 for Moon.</p>

        <button id="startButton">Start AR Camera</button>
      </div>
    </div>

    <div id="status">Waiting for camera...</div>

    <!-- ===================================
     AR SCENE
=================================== -->

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="
        antialias: true;
        alpha: true;
        colorManagement: true;
        physicallyCorrectLights: true;
    "
      arjs="
        sourceType: webcam;
        trackingMethod: best;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        debugUIEnabled: false;
    "
    >
      <!-- ===================================
     ASSETS
=================================== -->

      <a-assets>
        <a-asset-item id="earthAsset" src="./earth.glb"> </a-asset-item>

        <a-asset-item id="moonAsset" src="./moon.glb"> </a-asset-item>
      </a-assets>

      <!-- ===================================
     LIGHTING
=================================== -->

      <!-- Strong ambient light -->

      <a-entity
        light="
        type: ambient;
        color: #ffffff;
        intensity: 3;
    "
      >
      </a-entity>

      <!-- Main light -->

      <a-entity
        light="
        type: directional;
        color: #ffffff;
        intensity: 4;
    "
        position="2 4 4"
      >
      </a-entity>

      <!-- Fill light -->

      <a-entity
        light="
        type: directional;
        color: #ffffff;
        intensity: 2;
    "
        position="-3 2 1"
      >
      </a-entity>

      <!-- ===================================
     EARTH MARKER
     BARCODE 5
=================================== -->

      <a-marker
        id="earthMarker"
        type="barcode"
        value="5"
        size="1"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="earthModel"
          gltf-model="#earthAsset"
          position="0 0 0"
          scale="1 1 1"
        >
        </a-entity>
      </a-marker>

      <!-- ===================================
     MOON MARKER
     BARCODE 7
=================================== -->

      <a-marker
        id="moonMarker"
        type="barcode"
        value="7"
        size="1"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="moonModel"
          gltf-model="#moonAsset"
          position="0 0 0"
          scale="1 1 1"
        >
        </a-entity>
      </a-marker>

      <!-- CAMERA -->

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      /* ===================================
   ELEMENTS
=================================== */

      const start = document.getElementById("start");

      const startButton = document.getElementById("startButton");

      const status = document.getElementById("status");

      const earth = document.getElementById("earthModel");

      const moon = document.getElementById("moonModel");

      const earthMarker = document.getElementById("earthMarker");

      const moonMarker = document.getElementById("moonMarker");

      /* ===================================
   CAMERA START
=================================== */

      startButton.addEventListener("click", async () => {
        status.innerText = "Requesting camera...";

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment",
              },
            },

            audio: false,
          });

          /*
           * We only use this request
           * to trigger permission.
           *
           * AR.js will manage the camera.
           */

          stream.getTracks().forEach((track) => {
            track.stop();
          });

          start.style.display = "none";

          status.innerText = "Camera ready — scan Barcode 5 or 7";
        } catch (error) {
          console.error(error);

          status.innerText = "Camera permission failed";
        }
      });

      /* ===================================
   FIX GLTF MATERIALS
=================================== */

      function fixMaterials(modelEntity) {
        if (!modelEntity.object3D) {
          return;
        }

        modelEntity.object3D.traverse(function (object) {
          if (!object.isMesh) {
            return;
          }

          /*
           * Enable shadows
           */

          object.castShadow = true;

          object.receiveShadow = true;

          /*
           * Fix materials
           */

          if (object.material) {
            const materials = Array.isArray(object.material)
              ? object.material
              : [object.material];

            materials.forEach(function (material) {
              /*
               * Make sure the material
               * uses its texture.
               */

              material.needsUpdate = true;

              /*
               * Do not make the model
               * transparent accidentally.
               */

              material.transparent = false;

              material.opacity = 1;

              /*
               * Fix color if material
               * has an invalid color.
               */

              if (
                material.color &&
                material.color.r === 0 &&
                material.color.g === 0 &&
                material.color.b === 0
              ) {
                material.color.setRGB(1, 1, 1);
              }
            });
          }
        });
      }

      /* ===================================
   AUTO SCALE MODEL
=================================== */

      function fitModel(modelEntity) {
        if (!modelEntity.object3D) {
          return;
        }

        const THREE = AFRAME.THREE;

        const box = new THREE.Box3().setFromObject(modelEntity.object3D);

        const size = new THREE.Vector3();

        const center = new THREE.Vector3();

        box.getSize(size);

        box.getCenter(center);

        /*
         * Current model dimensions
         */

        console.log("Model size:", size);

        /*
         * Center the actual GLB
         */

        modelEntity.object3D.position.x -= center.x;

        modelEntity.object3D.position.y -= center.y;

        modelEntity.object3D.position.z -= center.z;

        /*
         * Automatically scale model
         *
         * Target size = approximately
         * 1 AR marker unit.
         */

        const maxDimension = Math.max(size.x, size.y, size.z);

        if (maxDimension > 0) {
          const targetSize = 0.8;

          const scale = targetSize / maxDimension;

          modelEntity.object3D.scale.set(scale, scale, scale);
        }
      }

      /* ===================================
   EARTH LOADED
=================================== */

      earth.addEventListener("model-loaded", function () {
        console.log("EARTH GLB LOADED");

        fixMaterials(earth);

        fitModel(earth);

        status.innerText = "🌎 Earth model ready";
      });

      /* ===================================
   MOON LOADED
=================================== */

      moon.addEventListener("model-loaded", function () {
        console.log("MOON GLB LOADED");

        fixMaterials(moon);

        fitModel(moon);

        status.innerText = "🌕 Moon model ready";
      });

      /* ===================================
   EARTH ERROR
=================================== */

      earth.addEventListener("model-error", function (event) {
        console.error("EARTH GLB ERROR", event);

        status.innerText = "Earth GLB rendering error";
      });

      /* ===================================
   MOON ERROR
=================================== */

      moon.addEventListener("model-error", function (event) {
        console.error("MOON GLB ERROR", event);

        status.innerText = "Moon GLB rendering error";
      });

      /* ===================================
   EARTH MARKER
=================================== */

      earthMarker.addEventListener("markerFound", function () {
        status.innerText = "🌎 Earth detected";
      });

      earthMarker.addEventListener("markerLost", function () {
        status.innerText = "Searching for marker...";
      });

      /* ===================================
   MOON MARKER
=================================== */

      moonMarker.addEventListener("markerFound", function () {
        status.innerText = "🌕 Moon detected";
      });

      moonMarker.addEventListener("markerLost", function () {
        status.innerText = "Searching for marker...";
      });
    </script>
  </body>
</html>
