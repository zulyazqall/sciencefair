<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no"
    />

    <title>AR Earth & Moon</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
      }

      #start {
        position: fixed;
        z-index: 9999;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #050816;
        color: white;
      }

      .start-box {
        width: 85%;
        max-width: 420px;
        text-align: center;
        padding: 30px;

        border-radius: 20px;

        background: rgba(255, 255, 255, 0.08);
      }

      .start-box h1 {
        font-size: 28px;
      }

      .start-box p {
        color: #bbb;
        line-height: 1.5;
      }

      button {
        border: none;
        border-radius: 12px;

        padding: 15px 30px;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
      }

      #status {
        position: fixed;

        z-index: 1000;

        bottom: 20px;

        left: 50%;

        transform: translateX(-50%);

        padding: 12px 18px;

        background: rgba(0, 0, 0, 0.8);

        color: white;

        border-radius: 30px;

        font-size: 14px;

        white-space: nowrap;
      }

      #debug {
        position: fixed;

        z-index: 1001;

        top: 15px;

        left: 15px;

        right: 15px;

        padding: 12px;

        background: rgba(0, 0, 0, 0.75);

        color: white;

        border-radius: 12px;

        font-size: 12px;

        display: none;
      }
    </style>
  </head>

  <body>
    <!-- START SCREEN -->

    <div id="start">
      <div class="start-box">
        <h1>🌎 AR Planets</h1>

        <p>Scan Barcode 5 to see Earth. Scan Barcode 7 to see the Moon.</p>

        <button id="startButton">Start Camera</button>
      </div>
    </div>

    <div id="debug"></div>

    <div id="status">Waiting...</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="
        antialias: true;
        alpha: true;
        colorManagement: true;
    "
      arjs="
        sourceType: webcam;
        trackingMethod: best;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        debugUIEnabled: false;
    "
      loading-screen="enabled: false"
    >
      <!-- =========================
         MODELS
    ========================== -->

      <a-assets timeout="30000">
        <a-asset-item id="earthGLB" src="./earth.glb"> </a-asset-item>

        <a-asset-item id="moonGLB" src="./moon.glb"> </a-asset-item>
      </a-assets>

      <!-- =========================
         LIGHTING
    ========================== -->

      <a-entity
        light="
            type: ambient;
            intensity: 2;
            color: #ffffff;
        "
      >
      </a-entity>

      <a-entity
        light="
            type: directional;
            intensity: 3;
            color: #ffffff;
        "
        position="2 4 3"
      >
      </a-entity>

      <!-- =========================
         EARTH BARCODE 5
    ========================== -->

      <a-marker
        id="earthMarker"
        type="barcode"
        value="5"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="earthModel"
          gltf-model="#earthGLB"
          position="0 0 0"
          scale="1 1 1"
          visible="true"
        >
        </a-entity>
      </a-marker>

      <!-- =========================
         MOON BARCODE 7
    ========================== -->

      <a-marker
        id="moonMarker"
        type="barcode"
        value="7"
        smooth="true"
        smooth-count="10"
        smooth-tolerance="0.01"
        smooth-threshold="5"
      >
        <a-entity
          id="moonModel"
          gltf-model="#moonGLB"
          position="0 0 0"
          scale="1 1 1"
          visible="true"
        >
        </a-entity>
      </a-marker>

      <!-- CAMERA -->

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      /* =========================================
   ELEMENTS
========================================= */

      const start = document.getElementById("start");

      const startButton = document.getElementById("startButton");

      const status = document.getElementById("status");

      const debug = document.getElementById("debug");

      const earthMarker = document.getElementById("earthMarker");

      const moonMarker = document.getElementById("moonMarker");

      const earthModel = document.getElementById("earthModel");

      const moonModel = document.getElementById("moonModel");

      /* =========================================
   DEBUG
========================================= */

      function log(message) {
        console.log(message);

        debug.style.display = "block";

        debug.innerHTML += message + "<br>";
      }

      /* =========================================
   CAMERA
========================================= */

      startButton.addEventListener("click", async function () {
        status.innerText = "Starting camera...";

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: "environment",
              },
            },

            audio: false,
          });

          stream.getTracks().forEach((track) => track.stop());

          start.style.display = "none";

          status.innerText = "Camera ready — scan marker";
        } catch (error) {
          console.error(error);

          status.innerText = "Camera permission failed";

          log("Camera error: " + error.message);
        }
      });

      /* =========================================
   EARTH MODEL
========================================= */

      earthModel.addEventListener("model-loaded", function (event) {
        log("✓ Earth GLB loaded");

        status.innerText = "Earth model loaded";
      });

      earthModel.addEventListener("model-error", function (event) {
        console.error("Earth error", event);

        log("✕ Earth GLB failed");

        status.innerText = "Earth GLB failed";
      });

      /* =========================================
   MOON MODEL
========================================= */

      moonModel.addEventListener("model-loaded", function (event) {
        log("✓ Moon GLB loaded");

        status.innerText = "Moon model loaded";
      });

      moonModel.addEventListener("model-error", function (event) {
        console.error("Moon error", event);

        log("✕ Moon GLB failed");

        status.innerText = "Moon GLB failed";
      });

      /* =========================================
   EARTH MARKER
========================================= */

      earthMarker.addEventListener("markerFound", function () {
        status.innerText = "🌎 EARTH MARKER FOUND";

        log("Earth marker detected");
      });

      earthMarker.addEventListener("markerLost", function () {
        status.innerText = "Searching for marker...";
      });

      /* =========================================
   MOON MARKER
========================================= */

      moonMarker.addEventListener("markerFound", function () {
        status.innerText = "🌕 MOON MARKER FOUND";

        log("Moon marker detected");
      });

      moonMarker.addEventListener("markerLost", function () {
        status.innerText = "Searching for marker...";
      });

      /* =========================================
   CHECK GLB FILES
========================================= */

      fetch("./earth.glb", {
        method: "HEAD",
      })
        .then((response) => {
          if (response.ok) {
            log("✓ earth.glb found");
          } else {
            log("✕ earth.glb HTTP " + response.status);
          }
        })
        .catch((error) => {
          log("✕ Cannot access earth.glb");
        });

      fetch("./moon.glb", {
        method: "HEAD",
      })
        .then((response) => {
          if (response.ok) {
            log("✓ moon.glb found");
          } else {
            log("✕ moon.glb HTTP " + response.status);
          }
        })
        .catch((error) => {
          log("✕ Cannot access moon.glb");
        });
    </script>
  </body>
</html>
