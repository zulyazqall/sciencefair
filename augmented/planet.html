<!doctype html>
<html>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <script src="js/aframe.min.js"></script>
  <script src="js/aframe-ar.js"></script>
  <body style="margin: 0px; overflow: hidden">
    <a-scene
      embedded
      vr-mode-ui="enabled: false;"
      arjs="debugUIEnabled: false;"
    >
      <a-assets>
        <img id="earth-sphere" src="images/earth-sphere.jpg" />
      </a-assets>

      <a-assets>
        <img id="moon-sphere" src="images/moon.jpg" />
      </a-assets>

      <a-assets>
        <img id="mars-sphere" src="images/mars.jpg" />
      </a-assets>

      <a-assets>
        <img id="mercury-sphere" src="images/mercury.jpg" />
      </a-assets>

      <a-assets>
        <img id="neptune-sphere" src="images/neptune.jpg" />
      </a-assets>

      <!-- 
    for more info, see: https://aframe.io/docs/1.0.0/components/animation.html 
    for more examples:  https://stemkoski.github.io/A-Frame-Examples/animation.html
    -->

      <a-marker type="pattern" url="data/kanji.patt">
        <a-sphere
          position="0 0.5 0"
          material="src: #earth-sphere; transparent: true; opacity: 0.95;"
          animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;"
        >
        </a-sphere>
      </a-marker>

      <a-marker type="pattern" url="data/hiro.patt">
        <a-sphere
          position="0 0.5 0"
          material="src: #moon-sphere; transparent: true; opacity: 0.95;"
          animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;"
        >
        </a-sphere>
      </a-marker>

      <a-marker type="barcode" value="0" id="mars-sphere" registerevents>
        <a-sphere
          position="0 0.5 0"
          material="src: #mars-sphere; transparent: true; opacity: 0.95;"
          animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;"
        >
        </a-sphere>
      </a-marker>

      <a-marker type="barcode" value="1" id="mercury-sphere" registerevents>
        <a-sphere
          position="0 0.5 0"
          material="src: #mercury-sphere; transparent: true; opacity: 0.95;"
          animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;"
        >
        </a-sphere>
      </a-marker>

      <a-marker type="barcode" value="2" id="neptune-sphere" registerevents>
        <a-sphere
          position="0 0.5 0"
          material="src: #neptune-sphere; transparent: true; opacity: 0.95;"
          animation__rotate="property: rotation; dur: 8000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;"
        >
        </a-sphere>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
