<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>AR Planet Explorer</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js Marker Tracking -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
      }

      .ui {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        pointer-events: none;
      }

      .title {
        margin: 20px auto 0;
        width: fit-content;
        padding: 12px 20px;
        border-radius: 30px;

        background: rgba(10, 20, 40, 0.85);
        color: white;

        font-size: 18px;
        font-weight: bold;

        backdrop-filter: blur(10px);
      }

      .instruction {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);

        width: calc(100% - 40px);
        max-width: 500px;

        padding: 14px 18px;

        border-radius: 15px;

        background: rgba(0, 0, 0, 0.75);
        color: white;

        text-align: center;
        font-size: 14px;
      }

      .planet-info {
        position: fixed;
        top: 80px;
        left: 20px;

        padding: 12px 16px;

        background: rgba(0, 0, 0, 0.65);
        color: white;

        border-radius: 12px;

        display: none;
      }
    </style>

    <script>
      /*
       * Custom planet component
       */
      AFRAME.registerComponent("planet", {
        schema: {
          color: {
            type: "color",
            default: "#2f6fed",
          },
        },

        init: function () {
          const el = this.el;

          /*
           * Main planet
           */
          const planet = document.createElement("a-sphere");

          planet.setAttribute("radius", "1");

          planet.setAttribute(
            "material",
            `
          color: ${this.data.color};
          roughness: 0.8;
          metalness: 0;
          `,
          );

          el.appendChild(planet);

          /*
           * Atmosphere
           */
          const atmosphere = document.createElement("a-sphere");

          atmosphere.setAttribute("radius", "1.08");

          atmosphere.setAttribute(
            "material",
            `
          color: #66ccff;
          opacity: 0.18;
          transparent: true;
          side: double;
          `,
          );

          el.appendChild(atmosphere);

          /*
           * Continents
           * Simple green shapes placed around Earth
           */
          const continents = [
            { x: 0.3, y: 0.3, z: 0.9, scale: "0.35 0.2 0.05" },
            { x: -0.5, y: 0.1, z: 0.8, scale: "0.25 0.35 0.05" },
            { x: 0.1, y: -0.4, z: 0.85, scale: "0.2 0.3 0.05" },
            { x: 0.6, y: -0.2, z: 0.65, scale: "0.25 0.2 0.05" },
          ];

          continents.forEach((c) => {
            const land = document.createElement("a-sphere");

            land.setAttribute("position", `${c.x} ${c.y} ${c.z}`);

            land.setAttribute("scale", c.scale);

            land.setAttribute(
              "material",
              `
            color: #35a853;
            roughness: 1;
            `,
            );

            el.appendChild(land);
          });

          /*
           * Rotation animation
           */
          el.setAttribute(
            "animation",
            `
          property: rotation;
          to: 0 360 0;
          dur: 12000;
          easing: linear;
          loop: true;
          `,
          );
        },
      });

      /*
       * Marker detection
       */
      AFRAME.registerComponent("marker-events", {
        init: function () {
          const marker = this.el;

          const info = document.querySelector(".planet-info");

          marker.addEventListener("markerFound", function () {
            console.log("Planet marker detected!");

            info.style.display = "block";
          });

          marker.addEventListener("markerLost", function () {
            console.log("Marker lost");

            info.style.display = "none";
          });
        },
      });
    </script>
  </head>

  <body>
    <!-- UI -->

    <div class="ui">
      <div class="title">🌍 AR Planet Explorer</div>
    </div>

    <div class="planet-info">
      🌍 Earth<br />
      <small>AR Planet detected</small>
    </div>

    <div class="instruction">
      Point your camera at the <b>Hiro marker</b> to see Earth.
    </div>

    <!-- AR SCENE -->

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="
      antialias: true;
      alpha: true;
      logarithmicDepthBuffer: true;
    "
      arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "
    >
      <!-- MARKER -->

      <a-marker
        preset="hiro"
        marker-events
        emitevents="true"
        smooth="true"
        smooth-count="5"
      >
        <!-- PLANET -->

        <a-entity position="0 1.2 0" scale="0.7 0.7 0.7" planet> </a-entity>

        <!-- Planet Label -->

        <a-text
          value="EARTH"
          position="0 2.55 0"
          align="center"
          color="white"
          width="4"
          look-at="[camera]"
        >
        </a-text>
      </a-marker>

      <!-- CAMERA -->

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
